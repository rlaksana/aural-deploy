services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_VOICE_RELAY_URL: ${NEXT_PUBLIC_VOICE_RELAY_URL:-}
    image: aural-app
    env_file: .env
    restart: unless-stopped
    expose:
      - "3000"

  ai-drain:
    # Drains the ai_jobs queue by calling the app's own cron endpoint on the
    # compose network every 5 minutes. Deliberately local: Cloudflare blocks
    # GitHub Actions runner IPs and Vercel Hobby caps functions at 60s, so
    # neither can reach this long-running executor reliably.
    image: aural-app
    command:
      - sh
      - -c
      - |
        if [ -z "$${CRON_SECRET}" ]; then
          echo "CRON_SECRET is not set - refusing to start" >&2
          exit 1
        fi
        while true; do
          node -e "fetch('http://web:3000/api/cron/ai-jobs',{method:'POST',headers:{authorization:'Bearer '+process.env.CRON_SECRET}}).then(r=>{console.log(new Date().toISOString(),'ai-drain',r.status)}).catch(e=>console.error(new Date().toISOString(),'ai-drain',e.message))" || true
          sleep 300
        done
    env_file: .env
    restart: unless-stopped
    depends_on:
      - web

  voice-relay:
    image: aural-app
    command: ["npx", "tsx", "server/voice-relay.ts"]
    env_file: .env
    environment:
      VOICE_RELAY_PORT: "8766"
    restart: unless-stopped
    expose:
      - "8766"

  caddy:
    image: caddy:2-alpine
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
